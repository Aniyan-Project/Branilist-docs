"""Public integration API. This schema is independent of the site's GraphQL schema."""
schema { query: Query mutation: Mutation }
scalar Time

enum MediaType { ANIME MANGA }
enum ListStatus { PLANNING CURRENT COMPLETED PAUSED DROPPED }
"""All pages are bounded: first 1–100, offset 0–10000."""
type PageInfo { limit: Int! offset: Int! hasNextPage: Boolean! }
type APIInfo { name: String! version: String! schemaUrl: String! }
type MediaTitle { romaji: String! english: String native: String portuguese: String }

type Query {
  forumCategories(first: Int! = 20, offset: Int! = 0): ForumCategoryPage
  forumTags(first: Int! = 20, offset: Int! = 0): ForumTagPage
  forumTopics(filter: ForumTopicFilter, sort: ForumSort! = ACTIVITY, first: Int! = 20, offset: Int! = 0): ForumTopicPage
  forumTopic(id: ID!): ForumTopic
  forumPost(id: ID!): ForumPost
  forumSpaces(first: Int! = 20, offset: Int! = 0): ForumSpacePage
  forumSpace(slug: String!): ForumSpace
  review(id: ID!): SocialReview
  reviews(mediaId: ID!, first: Int! = 20, offset: Int! = 0): SocialReviewPage
  comments(mediaId: ID, reviewId: ID, activityId: ID, first: Int! = 20, offset: Int! = 0): SocialCommentPage
  post(id: ID!): SocialPost
  api: APIInfo!
  """Supply exactly one of id, malId or anilistId. Only existing catalog mappings are used."""
  media(id: ID, malId: ID, anilistId: ID): Media
  """Public catalog ordered by descending internal ID. Search matches titles; no search returns the catalog."""
  mediaPage(search: String, type: MediaType, first: Int! = 20, offset: Int! = 0, filter: CatalogFilter, sort: CatalogSort! = ID_DESC): MediaPage!
  mediaBySlug(slug: String!, type: MediaType!): Media
  trendingMedia(type: MediaType, days: Int! = 30, first: Int! = 12): [Media!]!
  collection(id: ID!): Collection
  publicCollections(search: String, type: MediaType, first: Int! = 20, offset: Int! = 0): CollectionPage!
  genres(first: Int! = 20, offset: Int! = 0): GenrePage!
  staff(id: ID!): Staff
  character(id: ID!): Character
  studio(id: ID!): Studio
  """OAuth profile:read. Supply exactly one argument; username:"123456" is unambiguous."""
  user(id: ID, username: String): User
  """OAuth required. Individual fields enforce their own read scopes."""
  viewer: Viewer
}

type Media {
  id: ID!
  slug: String!
  type: MediaType!
  status: String!
  format: String!
  title: MediaTitle!
  description: String
  descriptionEnglish: String
  coverImage: String
  bannerImage: String
  episodes: Int
  chapters: Int
  seasonYear: Int
  averageScore: Int
  popularity: Int!
  isAdult: Boolean!
  malId: ID
  anilistId: ID
  genres(first: Int! = 20, offset: Int! = 0): GenrePage!
  relations(first: Int! = 20, offset: Int! = 0): MediaRelationPage!
  studios(first: Int! = 20, offset: Int! = 0): StudioCreditPage!
  staff(first: Int! = 20, offset: Int! = 0): StaffCreditPage!
  characters(first: Int! = 20, offset: Int! = 0): CharacterCreditPage!
  similar(first: Int! = 12): [Media!]!
  """OAuth library:read; only the token owner's entry."""
  viewerEntry: LibraryEntry
}
type MediaPage { nodes: [Media!]! pageInfo: PageInfo! }
type Genre { id: ID! slug: String! name: String! }
type GenrePage { nodes: [Genre!]! pageInfo: PageInfo! }
type Studio { id: ID! slug: String! name: String! websiteUrl: String countryCode: String description: String logoUrl: String }
type Staff { id: ID! slug: String! name: String! nativeName: String imageUrl: String bio: String }
type Character { id: ID! slug: String! name: String! nativeName: String imageUrl: String description: String }
type StudioCredit { role: String! isMain: Boolean! studio: Studio! }
type StaffCredit { role: String! roleGroup: String! staff: Staff! }
type CharacterCredit { role: String! character: Character! }
type MediaRelation { type: String! mediaId: ID! media: Media }
type StudioCreditPage { nodes: [StudioCredit!]! pageInfo: PageInfo! }
type StaffCreditPage { nodes: [StaffCredit!]! pageInfo: PageInfo! }
type CharacterCreditPage { nodes: [CharacterCredit!]! pageInfo: PageInfo! }
type MediaRelationPage { nodes: [MediaRelation!]! pageInfo: PageInfo! }

"""Public profile only. Private/followers-only accounts and blocks are never bypassed."""
type User {
  followers(first: Int! = 20, offset: Int! = 0): SocialActorPage
  following(first: Int! = 20, offset: Int! = 0): SocialActorPage
  posts(first: Int! = 20, offset: Int! = 0): SocialPostPage
  reviews(first: Int! = 20, offset: Int! = 0): SocialReviewPage
  id: ID!
  username: String!
  displayName: String!
  avatarUrl: String
  bannerUrl: String
  bio: String
  createdAt: Time!
  """OAuth library:read, PUBLIC lists, excludes private entries."""
  library(status: ListStatus, type: MediaType, first: Int! = 20, offset: Int! = 0): LibraryPage
  """OAuth activity:read, PUBLIC lists/activity. Published MEDIA_LIST feed events only."""
  activity(first: Int! = 20, offset: Int! = 0): PublicActivityPage
  """OAuth collections:read, PUBLIC lists and PUBLIC collections only."""
  collections(first: Int! = 20, offset: Int! = 0): CollectionPage
}
type Profile { id: ID! username: String! displayName: String! avatarUrl: String bannerUrl: String bio: String createdAt: Time! }
type Viewer {
 forumSubscriptions(first: Int! = 20, offset: Int! = 0): ForumTopicPage
  feed(scope: CommunityFeedScope! = FOLLOWING, types: [CommunityActivityType!]! = [], first: Int! = 20, offset: Int! = 0): SocialActivityPage
  followers(first: Int! = 20, offset: Int! = 0): SocialActorPage
  following(first: Int! = 20, offset: Int! = 0): SocialActorPage
  posts(first: Int! = 20, offset: Int! = 0): SocialPostPage
  myReview(mediaId: ID!): SocialReview
  notifications(first: Int! = 20, offset: Int! = 0): SocialNotificationPage
  unreadNotificationCount: Int
  notificationPreferences: SocialNotificationPreferences
  notificationTypePreferences: [SocialNotificationTypePreference!]
  blockedUsers(first: Int! = 20, offset: Int! = 0): SocialActorPage
  mutedUsers(first: Int! = 20, offset: Int! = 0): SocialActorPage
  id: ID!
  scopes: [String!]!
  preferences: Preferences
  privacy: PrivacySettings
  libraryInsights: LibraryInsights
  favourites(type: FavouriteType!, first: Int! = 20, offset: Int! = 0): FavouritePage
  recommendations(first: Int! = 12): [Media!]
  libraryPage(search: String, status: ListStatus, type: MediaType, sort: LibrarySort! = UPDATED, first: Int! = 20, offset: Int! = 0): LibraryPage
  """OAuth profile:read; includes the owner's profile even when private."""
  profile: Profile
  """OAuth library:read; includes the owner's private entries."""
  library(status: ListStatus, type: MediaType, first: Int! = 20, offset: Int! = 0): LibraryPage
  libraryEntry(mediaId: ID!): LibraryEntry
  """OAuth activity:read; personal audit history, distinct from User.activity."""
  activity(first: Int! = 20, offset: Int! = 0): HistoryPage
  """OAuth collections:read; includes private and unlisted collections."""
  collections(first: Int! = 20, offset: Int! = 0): CollectionPage
}
type LibraryEntry {
  mediaId: ID!
  status: ListStatus!
  progress: Int!
  """Personal rating 0.5–10 in half-point steps; not the catalog's 0–100 scale."""
  score: Float
  repeatCount: Int!
  startedAt: Time
  completedAt: Time
  private: Boolean!
  updatedAt: Time!
  media: Media
}
type LibraryPage { nodes: [LibraryEntry!]! pageInfo: PageInfo! }
type PublicActivity { id: ID! type: String! mediaId: ID! status: ListStatus progress: Int createdAt: Time! }
type PublicActivityPage { nodes: [PublicActivity!]! pageInfo: PageInfo! }
type HistoryItem { id: ID! mediaId: ID! eventType: String! status: ListStatus previousStatus: ListStatus progress: Int previousProgress: Int progressDelta: Int score: Float repeatCount: Int! createdAt: Time! }
type HistoryPage { nodes: [HistoryItem!]! pageInfo: PageInfo! }
type Collection {
  id: ID!
  mediaType: MediaType!
  name: String!
  slug: String!
  description: String
  color: String!
  visibility: String!
  tags: [String!]!
  coverMediaId: ID
  position: Int!
  publishedAt: Time
  createdAt: Time!
  updatedAt: Time!
  itemCount: Int!
  items(first: Int! = 20, offset: Int! = 0): MediaPage
}
type CollectionPage { nodes: [Collection!]! pageInfo: PageInfo! }

"""Omitted fields preserve existing values. New entries default to PLANNING/0/null/false.
Only score, startedAt and completedAt accept explicit null to clear their values.
Dates accept YYYY-MM-DD or RFC3339; CURRENT/COMPLETED can autofill absent dates."""
input LibraryEntryInput {
  status: ListStatus
  progress: Int
  score: Float
  repeatCount: Int
  startedAt: String
  completedAt: String
  private: Boolean
}
type RemovalResult { mediaId: ID! removed: Boolean! }
type Mutation {
 createForumTopic(input: ForumTopicInput!): ForumTopic
 createForumPost(topicId: ID!, parentId: ID, body: String!): ForumPost
 updateForumPost(id: ID!, body: String!, reason: String): ForumPost
 deleteForumPost(id: ID!): Boolean
 setForumTopicTags(id: ID!, tagIds: [ID!]!): Boolean
 setForumSubscription(id: ID!, enabled: Boolean!): Boolean
 setForumReaction(id: ID!, reaction: ForumReaction!, enabled: Boolean!): Boolean
 setForumMembership(spaceId: ID!, enabled: Boolean!): Boolean
  setFollow(username: String!, enabled: Boolean!): Boolean
  setBlock(username: String!, enabled: Boolean!): Boolean
  setMute(username: String!, enabled: Boolean!): Boolean
  createPost(input: SocialPostInput!): SocialPost
  updatePost(id: ID!, body: String!): SocialPost
  deletePost(id: ID!): Boolean
  setPostLike(id: ID!, enabled: Boolean!): Boolean
  setPostRepost(id: ID!, enabled: Boolean!): Boolean
  setActivityLike(id: ID!, enabled: Boolean!): Boolean
  deleteActivity(id: ID!): Boolean
  saveReview(input: SocialReviewInput!): SocialReview
  deleteReview(id: ID!): Boolean
  setReviewLike(id: ID!, enabled: Boolean!): Boolean
  setReviewReaction(id: ID!, reaction: CommunityReaction!, enabled: Boolean!): Boolean
  createComment(input: SocialCommentInput!): SocialComment
  deleteComment(id: ID!): Boolean
  setCommentLike(id: ID!, enabled: Boolean!): Boolean
  markNotificationRead(id: ID!): Boolean
  markAllNotificationsRead: Int
  saveNotificationPreferences(input: SocialNotificationPreferencesInput!): SocialNotificationPreferences
  saveNotificationTypePreference(input: SocialNotificationTypeInput!): SocialNotificationTypePreference
  reportContent(input: SocialReportInput!): ReportReceipt
  updateProfile(input: ProfileInput!): Profile
  savePreferences(input: PreferencesInput!): Preferences
  savePrivacy(input: PrivacyInput!): PrivacySettings
  setFavourite(type: FavouriteType!, id: ID!, enabled: Boolean!): FavouriteState
  reorderFavourites(type: FavouriteType!, ids: [ID!]!): Boolean
  createCollection(input: CollectionCreateInput!): Collection
  updateCollection(id: ID!, input: CollectionUpdateInput!): Collection
  deleteCollection(id: ID!): Boolean
  setCollectionItem(collectionId: ID!, mediaId: ID!, enabled: Boolean! = true, position: Int! = 0, note: String): Boolean
  """OAuth library:write. Atomic create/update of the token owner's entry only."""
  saveLibraryEntry(mediaId: ID!, input: LibraryEntryInput!): LibraryEntry
  """OAuth library:write. Idempotent removal; history is committed with deletion."""
  removeLibraryEntry(mediaId: ID!): RemovalResult
}

"""All supplied catalog filters are combined. Genre uses its slug. Adult visibility follows the current principal."""
input CatalogFilter { genre: String yearFrom: Int yearTo: Int season: Season format: String status: CatalogStatus }
enum CatalogSort { ID_DESC POPULARITY_DESC SCORE_DESC TITLE_ASC YEAR_DESC }
enum CatalogStatus { UPCOMING RELEASING FINISHED CANCELLED HIATUS }
enum Season { WINTER SPRING SUMMER FALL }
enum LibrarySort { UPDATED TITLE SCORE PROGRESS STARTED COMPLETED }
enum FavouriteType { MEDIA STAFF STUDIO CHARACTER }
enum CollectionVisibility { PRIVATE UNLISTED PUBLIC }
enum Visibility { PUBLIC FOLLOWERS PRIVATE }
enum TitleLanguage { AUTO ROMAJI ENGLISH NATIVE PORTUGUESE }
enum Theme { SITE_DEFAULT DARK LIGHT }
enum DarkTheme { BRANILIST MIDNIGHT AMOLED SLATE }
type FavouriteState { type: FavouriteType! id: ID! enabled: Boolean! }
type Favourite { type: FavouriteType! id: ID! position: Int! media: Media staff: Staff studio: Studio character: Character }
type FavouritePage { nodes: [Favourite!]! pageInfo: PageInfo! }
type Preferences { localeCode: String! titleLanguage: TitleLanguage! theme: Theme! darkTheme: DarkTheme! hideAdultContent: Boolean! }
type PrivacySettings { profileVisibility: Visibility! listVisibility: Visibility! activityVisibility: Visibility! }
"""Replacement of editable profile fields. Omitted bio/avatar/banner clear them. Image URLs must belong to the token owner."""
input ProfileInput { displayName: String! bio: String avatarUrl: String bannerUrl: String bannerPositionX: Int bannerPositionY: Int }
input PreferencesInput { localeCode: String! titleLanguage: TitleLanguage! theme: Theme! darkTheme: DarkTheme hideAdultContent: Boolean! }
input PrivacyInput { profileVisibility: Visibility! listVisibility: Visibility! activityVisibility: Visibility! }
input CollectionCreateInput { mediaType: MediaType! name: String! description: String color: String! = "#FF8A3D" visibility: CollectionVisibility! = PRIVATE tags: [String!]! = [] coverMediaId: ID }
"""Replacement of collection metadata. Items remain unchanged."""
input CollectionUpdateInput { name: String! description: String color: String! = "#FF8A3D" visibility: CollectionVisibility! = PRIVATE tags: [String!]! = [] coverMediaId: ID position: Int! = 0 }
type InsightBreakdown { key: String! label: String! count: Int! percentage: Float! }
type LibraryInsights { mediaCount: Int! animeCount: Int! mangaCount: Int! completedCount: Int! episodesConsumed: Int! chaptersConsumed: Int! estimatedWatchMinutes: Int! averageScore: Float scoredCount: Int! repeatCount: Int! genres: [InsightBreakdown!]! formats: [InsightBreakdown!]! years: [InsightBreakdown!]! statuses: [InsightBreakdown!]! scores: [InsightBreakdown!]! countries: [InsightBreakdown!]! studios: [InsightBreakdown!]! }

enum CommunityFeedScope { FOLLOWING GLOBAL }
enum CommunityActivityType { MEDIA_LIST REVIEW FOLLOW PROFILE_POST REPOST }
enum CommunityRecommendation { RECOMMENDED MIXED NOT_RECOMMENDED }
enum CommunitySpoilerLevel { NONE MINOR MAJOR }
enum CommunityReaction { HELPFUL INSIGHTFUL WELL_WRITTEN }
enum PostVisibility { PUBLIC PRIVATE }
enum CommunityReportTarget { USER REVIEW COMMENT PROFILE_POST FORUM_TOPIC FORUM_POST }
enum NotificationEmailMode { OFF IMMEDIATE DAILY }
type SocialActor { id: ID! username: String! displayName: String! avatarUrl: String }
type SocialActorPage { nodes: [SocialActor!]! pageInfo: PageInfo! }
type SocialPost { id: ID! author: SocialActor! body: String! visibility: PostVisibility! recipientId: ID parentId: ID quotedPost: SocialPost images: [String!]! likeCount: Int! replyCount: Int! repostCount: Int! viewerLiked: Boolean! viewerReposted: Boolean! createdAt: Time! updatedAt: Time! replies(first: Int! = 20, offset: Int! = 0): SocialPostPage }
type SocialPostPage { nodes: [SocialPost!]! pageInfo: PageInfo! }
input SocialPostInput { body: String! visibility: PostVisibility! = PUBLIC recipientId: ID parentId: ID quotedPostId: ID images: [ID!]! = [] }
type SocialReview { id: ID! author: SocialActor! media: Media title: String body: String! recommendation: CommunityRecommendation! spoilerLevel: CommunitySpoilerLevel! aspects: CommunityAspectScores! reactions: CommunityReactionSummary! likeCount: Int! commentCount: Int! viewerLiked: Boolean! createdAt: Time! updatedAt: Time! }
type CommunityAspectScores { story: Int characters: Int visuals: Int sound: Int enjoyment: Int }
input CommunityAspectInput { story: Int characters: Int visuals: Int sound: Int enjoyment: Int }
type CommunityReactionSummary { helpful: Int! insightful: Int! wellWritten: Int! viewerHelpful: Boolean! viewerInsightful: Boolean! viewerWellWritten: Boolean! }
type SocialReviewPage { nodes: [SocialReview!]! pageInfo: PageInfo! }
"""Replaces the token owner's review for a media. Omitted optional title/aspect values are cleared."""
input SocialReviewInput { mediaId: ID! title: String body: String! recommendation: CommunityRecommendation! spoilerLevel: CommunitySpoilerLevel! = NONE aspects: CommunityAspectInput }
type SocialComment { id: ID! author: SocialActor! parentId: ID body: String! removed: Boolean! likeCount: Int! viewerLiked: Boolean! createdAt: Time! updatedAt: Time! }
type SocialCommentPage { nodes: [SocialComment!]! pageInfo: PageInfo! }
"""Exactly one discussion selector is required. parentId may identify a comment in that same discussion."""
input SocialCommentInput { mediaId: ID reviewId: ID activityId: ID parentId: ID body: String! }
type SocialActivity { id: ID! type: CommunityActivityType! actor: SocialActor! media: Media targetUser: SocialActor review: SocialReview post: SocialPost status: ListStatus progress: Int likeCount: Int! commentCount: Int! viewerLiked: Boolean! createdAt: Time! }
type SocialActivityPage { nodes: [SocialActivity!]! pageInfo: PageInfo! }
type SocialNotification { id: ID! type: String! actor: SocialActor media: Media reviewId: ID commentId: ID postId: ID forumTopicId: ID forumPostId: ID achievementKey: String preview: String priority: String! readAt: Time createdAt: Time! }
type SocialNotificationPage { nodes: [SocialNotification!]! pageInfo: PageInfo! }
type SocialNotificationPreferences { follows: Boolean! reviewLikes: Boolean! commentLikes: Boolean! replies: Boolean! reviewComments: Boolean! socialPosts: Boolean! emailMode: NotificationEmailMode! smartGrouping: Boolean! importantOnlyDefault: Boolean! quietHoursEnabled: Boolean! quietStartMinutes: Int! quietEndMinutes: Int! quietTimezone: String! showRealtimeIndicator: Boolean! }
"""Replacement of notification settings; quiet hours use minutes from midnight in an IANA timezone."""
input SocialNotificationPreferencesInput { follows: Boolean! reviewLikes: Boolean! commentLikes: Boolean! replies: Boolean! reviewComments: Boolean! socialPosts: Boolean! emailMode: NotificationEmailMode! smartGrouping: Boolean! importantOnlyDefault: Boolean! quietHoursEnabled: Boolean! quietStartMinutes: Int! quietEndMinutes: Int! quietTimezone: String! showRealtimeIndicator: Boolean! }
type SocialNotificationTypePreference { type: String! inAppEnabled: Boolean! emailEnabled: Boolean! mutedUntil: Time }
input SocialNotificationTypeInput { type: String! inAppEnabled: Boolean! emailEnabled: Boolean! mutedUntil: Time }
input SocialReportInput { targetType: CommunityReportTarget! targetId: ID! reason: String! details: String }
"""Receipt for the submitting account. Moderation data and other reporters are never exposed."""
type ReportReceipt { id: ID! status: String! createdAt: Time! }

"""OAuth forum:read. Archived topics and inaccessible authors/Spaces are excluded before pagination."""
input ForumTopicFilter { query: String categorySlug: String tagSlug: String spaceSlug: String status: ForumStatus }
enum ForumSort { RELEVANCE ACTIVITY POPULARITY NEWEST }
enum ForumStatus { OPEN LOCKED }
enum ForumReaction { LIKE HELPFUL AGREE INSIGHTFUL }
type ForumCategory { id: ID! slug: String! name: String! description: String! icon: String! color: String locked: Boolean! }
type ForumTag { id: ID! slug: String! name: String! description: String! color: String }
type ForumCategoryPage { nodes: [ForumCategory!]! pageInfo: PageInfo! }
type ForumTagPage { nodes: [ForumTag!]! pageInfo: PageInfo! }
type ForumTopicPage { nodes: [ForumTopic!]! pageInfo: PageInfo! }
type ForumSpacePage { nodes: [ForumSpace!]! pageInfo: PageInfo! }
type ForumPostPage { nodes: [ForumPost!]! pageInfo: PageInfo! }
type ForumTopic { id: ID! category: ForumCategory! author: SocialActor! title: String! status: ForumStatus! pinned: Boolean! featured: Boolean! tags: [ForumTag!]! spaceSlug: String viewCount: Int! postCount: Int! viewerSubscribed: Boolean! lastPostAt: Time! createdAt: Time! updatedAt: Time! posts(first: Int! = 20, offset: Int! = 0): ForumPostPage }
type ForumPost { id: ID! topicId: ID! parentId: ID author: SocialActor! body: String! removed: Boolean! viewerOwns: Boolean! reactions: [ForumReactionSummary!]! editedAt: Time createdAt: Time! updatedAt: Time! }
type ForumReactionSummary { type: ForumReaction! count: Int! viewerReacted: Boolean! }
type ForumSpace { id: ID! slug: String! name: String! description: String! rules: String! avatarUrl: String bannerUrl: String owner: SocialActor! memberCount: Int! topicCount: Int! viewerMember: Boolean! createdAt: Time! updatedAt: Time! }
"""Creates a topic outside Spaces. Tag IDs must be distinct (maximum 8)."""
input ForumTopicInput { categoryId: ID! title: String! body: String! tagIds: [ID!]! = [] }
